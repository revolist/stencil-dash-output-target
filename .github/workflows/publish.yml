name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Apply release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${RELEASE_TAG} must use the v<semver> format."
            exit 1
          fi
          PACKAGE_VERSION="${RELEASE_TAG#v}"

          npm version "${PACKAGE_VERSION}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build release tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets

      - name: Verify package exports
        run: |
          node -e "const m = require('@revolist/stencil-dash-output-target'); if (typeof m.dashOutputTarget !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('@revolist/stencil-dash-output-target'); if (typeof m.dashOutputTarget !== 'function') process.exit(1)"

      - name: Commit release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package manifests already contain ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${RELEASE_TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Publish to npm
        run: npm publish release-assets/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
