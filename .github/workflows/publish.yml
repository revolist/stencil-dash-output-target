name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "v${PACKAGE_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build release tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets

      - name: Verify package exports
        run: |
          node -e "const m = require('@revolist/stencil-dash-output-target'); if (typeof m.dashOutputTarget !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('@revolist/stencil-dash-output-target'); if (typeof m.dashOutputTarget !== 'function') process.exit(1)"

      - name: Publish to npm
        run: npm publish release-assets/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
